name: apply-patch3

# 一次性：跑 patch_utf8.py 修 Windows 编码，端完自己把脚本一起删了。
on:
  push:
    branches: [main]
    paths: [".github/workflows/apply-patch3.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        shell: bash
        run: |
          python patch_utf8.py
          python -m py_compile scripts/run_audit.py
          git diff --stat
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git rm -q patch_utf8.py
          git add scripts/run_audit.py .github/workflows/ci.yml
          git commit -m "fix(windows): run_audit 启动时把 stdout/stderr 重设为 UTF-8；CI 加 PYTHONUTF8"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main
