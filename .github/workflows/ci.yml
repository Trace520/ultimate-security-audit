name: CI & Self-Audit

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Check docs
        run: python scripts/check_docs.py
      - name: Run tests
        run: python -B -m pytest tests/ -q
      - name: Smoke run
        run: python -B tests/sandbox_test.py
      - name: CLI 入口（usa / python -m scripts）
        shell: bash
        run: |
          usa --help > /dev/null
          python -m scripts --help > /dev/null
          set +e
          python -B -m scripts tests/fixtures/sample > /dev/null 2>&1
          code=$?
          set -e
          echo "cli exit=$code"
          test "$code" -eq 2
      - name: SARIF 输出可解析
        shell: bash
        run: |
          python -B scripts/run_audit.py tests/fixtures/sample --approval-id CHG-SMOKE \
            --format sarif --out results.sarif --allow-findings
          python -B -c "import json;d=json.load(open('results.sarif'));assert d['version']=='2.1.0';assert d['runs'][0]['tool']['driver']['version']=='3.0.0';print('sarif ok')"
      - name: 状态机必须拦住跳步
        shell: bash
        run: |
          rm -f .audit-state.json
          python -B scripts/run_audit.py tests/fixtures/sample --approval-id CHG-SMOKE \
            --stage discovery --allow-findings > /dev/null
          set +e
          python -B scripts/run_audit.py tests/fixtures/sample --approval-id CHG-SMOKE \
            --stage report > /dev/null 2>&1
          code=$?
          set -e
          echo "state-machine exit=$code"
          test "$code" -eq 2

  audit-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 缺审批号必须 BLOCKED（fail-closed）
        shell: bash
        run: |
          set +e
          AUTHORIZATION_MODE=CI_PIPELINE python -B scripts/run_audit.py \
            --targets tests/fixtures/sample --json --notes "$RUNNER_TEMP/blocked.md"
          code=$?
          set -e
          echo "exit=$code"
          test "$code" -eq 2
      - name: 三项齐备时执行并打印证据笔记
        shell: bash
        run: |
          AUTHORIZATION_MODE=CI_PIPELINE AUDIT_APPROVAL_ID=CHG-CI-0001 \
            python -B scripts/run_audit.py --targets tests/fixtures/sample \
            --allow-findings --notes "$RUNNER_TEMP/exec.md"
          cat "$RUNNER_TEMP/exec.md"

  self-audit:
    name: 自我审计（SARIF → Security 面板）
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: 用本工具审计本仓库
        # 仓库里 examples/ 与 fixtures 自带演示密钥，扫到就是预期结果
        continue-on-error: true
        run: |
          usa . --approval-id CI-SELF-AUDIT --format sarif \
            --out results.sarif --allow-findings
          python -B -c "import json;d=json.load(open('results.sarif'));print('results:',len(d['runs'][0]['results']))"
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: self-audit
