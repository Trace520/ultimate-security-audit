name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Check docs
        run: python scripts/check_docs.py
      - name: Run tests
        run: python -B -m pytest tests/ -q
      - name: Smoke run
        run: python -B tests/sandbox_test.py
      - name: CLI 入口（usa / python -m scripts）
        run: |
          usa --help > /dev/null
          python -m scripts --help > /dev/null
          set +e
          python -B -m scripts tests/fixtures/sample > /dev/null 2>&1
          code=$?
          set -e
          echo "cli exit=$code"
          test "$code" -eq 2

  audit-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 缺审批号必须 BLOCKED（fail-closed）
        shell: bash
        run: |
          set +e
          AUTHORIZATION_MODE=CI_PIPELINE python -B scripts/run_audit.py \
            --targets tests/fixtures/sample --json --notes "$RUNNER_TEMP/blocked.md"
          code=$?
          set -e
          echo "exit=$code"
          test "$code" -eq 2
      - name: 三项齐备时执行并打印证据笔记
        shell: bash
        run: |
          AUTHORIZATION_MODE=CI_PIPELINE AUDIT_APPROVAL_ID=CHG-CI-0001 \
            python -B scripts/run_audit.py --targets tests/fixtures/sample \
            --allow-findings --notes "$RUNNER_TEMP/exec.md"
          cat "$RUNNER_TEMP/exec.md"
