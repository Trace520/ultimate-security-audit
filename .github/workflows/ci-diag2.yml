name: ci-diag2

# 一次性诊断 v2：按 ci.yml 的真实步骤逐条执行，记录每步 outcome 与输出。
on:
  push:
    branches: [main]
    paths: [".github/workflows/ci-diag2.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --upgrade pip 2>&1 | tee -a ci-diag2.log
          pip install -e . 2>&1 | tee -a ci-diag2.log
          pip install pytest 2>&1 | tee -a ci-diag2.log

      - id: docs
        continue-on-error: true
        shell: bash
        run: python scripts/check_docs.py 2>&1 | tee -a ci-diag2.log

      - id: tests
        continue-on-error: true
        shell: bash
        run: python -B -m pytest tests/ -q 2>&1 | tee -a ci-diag2.log

      - id: smoke
        continue-on-error: true
        shell: bash
        run: python -B tests/sandbox_test.py 2>&1 | tee -a ci-diag2.log

      - id: cli
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          { usa --help > /dev/null
            python -m scripts --help > /dev/null
            set +e
            python -B -m scripts tests/fixtures/sample > /dev/null 2>&1
            code=$?
            set -e
            echo "cli exit=$code"
            test "$code" -eq 2
          } 2>&1 | tee -a ci-diag2.log

      - id: sarif
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          { python -B scripts/run_audit.py tests/fixtures/sample --approval-id CHG-SMOKE \
              --format sarif --out results.sarif --allow-findings
            python -B -c "import json;d=json.load(open('results.sarif'));assert d['version']=='2.1.0';assert d['runs'][0]['tool']['driver']['version']=='3.0.0';print('sarif ok')"
          } 2>&1 | tee -a ci-diag2.log

      - id: state
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          { rm -f .audit-state.json
            python -B scripts/run_audit.py tests/fixtures/sample --approval-id CHG-SMOKE \
              --stage discovery --allow-findings > /dev/null
            set +e
            python -B scripts/run_audit.py tests/fixtures/sample --approval-id CHG-SMOKE \
              --stage report > /dev/null 2>&1
            code=$?
            set -e
            echo "state-machine exit=$code"
            test "$code" -eq 2
          } 2>&1 | tee -a ci-diag2.log

      - name: Report outcomes and push log
        if: always()
        shell: bash
        run: |
          cat >> ci-diag2.log <<EOF
## outcomes
install=${{ steps.install.outcome }}
docs=${{ steps.docs.outcome }}
tests=${{ steps.tests.outcome }}
smoke=${{ steps.smoke.outcome }}
cli=${{ steps.cli.outcome }}
sarif=${{ steps.sarif.outcome }}
state=${{ steps.state.outcome }}
EOF
          tail -c 500 ci-diag2.log
          git config user.name "ci-diag"
          git config user.email "ci-diag@users.noreply.github.com"
          git add -f ci-diag2.log
          git commit -m "diag2: CI 步骤 outcome" || echo "nothing to commit"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main
