name: apply-patch2

# 一次性：解码内嵌脚本，给 run_audit 加 UTF-8 控制台初始化、给 ci.yml 加 PYTHONUTF8。
on:
  push:
    branches: [main]
    paths: [".github/workflows/apply-patch2.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          python -m py_compile scripts/run_audit.py
          git diff --stat

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add scripts/run_audit.py .github/workflows/ci.yml
          git commit -m "fix(windows): run_audit 启动时把 stdout/stderr 重设为 UTF-8；CI 加 PYTHONUTF8" || echo nothing
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main
