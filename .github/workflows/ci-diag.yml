name: ci-diag

# 一次性诊断：把每个 CI 步骤的真实输出写回仓库，跑完删除。
on:
  push:
    branches: [main]
    paths: [".github/workflows/ci-diag.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run every CI step and record exit codes
        shell: bash
        run: |
          set +e
          LOG=ci-diag.log
          : > $LOG
          echo "## env" >> $LOG
          python --version >> $LOG 2>&1
          which python pip >> $LOG 2>&1
          pwd >> $LOG
          echo "## step: Install" >> $LOG
          python -m pip install --upgrade pip >> $LOG 2>&1; echo "exit=$?" >> $LOG
          pip install -e . >> $LOG 2>&1; echo "exit=$?" >> $LOG
          pip install pytest >> $LOG 2>&1; echo "exit=$?" >> $LOG
          echo "## step: Check docs" >> $LOG
          python scripts/check_docs.py >> $LOG 2>&1; echo "exit=$?" >> $LOG
          echo "## step: Run tests" >> $LOG
          python -B -m pytest tests/ -q >> $LOG 2>&1; echo "exit=$?" >> $LOG
          echo "## step: Smoke run" >> $LOG
          python -B tests/sandbox_test.py >> $LOG 2>&1; echo "exit=$?" >> $LOG
          echo "## step: CLI" >> $LOG
          usa --help >> $LOG 2>&1; echo "usa exit=$?" >> $LOG
          python -m scripts --help >> $LOG 2>&1; echo "m exit=$?" >> $LOG
          python -B -m scripts tests/fixtures/sample >> $LOG 2>&1; echo "cli exit=$?" >> $LOG
          echo "## step: SARIF" >> $LOG
          python -B scripts/run_audit.py tests/fixtures/sample --approval-id CHG-SMOKE --format sarif --out results.sarif --allow-findings >> $LOG 2>&1; echo "sarif write exit=$?" >> $LOG
          python -B -c "import json;d=json.load(open('results.sarif'));assert d['version']=='2.1.0';assert d['runs'][0]['tool']['driver']['version']=='3.0.0'" >> $LOG 2>&1; echo "sarif parse exit=$?" >> $LOG
          echo "## step: state machine" >> $LOG
          rm -f .audit-state.json
          python -B scripts/run_audit.py tests/fixtures/sample --approval-id CHG-SMOKE --stage discovery --allow-findings >> $LOG 2>&1; echo "discovery exit=$?" >> $LOG
          python -B scripts/run_audit.py tests/fixtures/sample --approval-id CHG-SMOKE --stage report >> $LOG 2>&1; echo "report exit=$?" >> $LOG
          tail -c 400 $LOG

      - name: Push log back to main
        shell: bash
        run: |
          git config user.name "ci-diag"
          git config user.email "ci-diag@users.noreply.github.com"
          git add -f ci-diag.log
          git commit -m "diag: CI 日志" || echo "nothing to commit"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main
