name: apply-patch

# 一次性：打 utf8.patch，提交后删除补丁文件。
on:
  push:
    branches: [main]
    paths: [".github/workflows/apply-patch.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        shell: bash
        run: |
          git apply --check utf8.patch
          git apply utf8.patch
          rm -f utf8.patch
          python -m py_compile scripts/run_audit.py && echo "py_compile ok"
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add scripts/run_audit.py .github/workflows/ci.yml
          git commit -m "fix(windows): run_audit 启动时把 stdout/stderr 重设为 UTF-8；CI 加 PYTHONUTF8"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main
