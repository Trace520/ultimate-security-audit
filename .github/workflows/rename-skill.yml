name: rename-skill

# 一次性：把 SKILL.md 的 name 对齐仓库名。
# 完成后本工作流会被删除；只在自身被改动时触发。

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-skill.yml'

permissions:
  contents: write

jobs:
  rename:
    if: github.repository == 'Trace520/ultimate-security-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename skill name to repo name
        run: |
          sed -i 's/^name: enterprise-security-audit$/name: ultimate-security-audit/' SKILL.md
          grep -q '^name: ultimate-security-audit$' SKILL.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "nothing to change"; exit 0; fi
          git commit -am "fix(skill): name 对齐仓库名 ultimate-security-audit"
          git push
